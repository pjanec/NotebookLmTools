[project]
name = "nlmtools"
version = "0.1.0"
description = "Load local .txt bundles into NotebookLM via Google Drive, and ask long questions about them"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0",
    "notebooklm-mcp-cli",
    # Used by the external dump tool. Declared here so the bundle can be built with this
    # project's own interpreter rather than depending on a user-level pip install that a
    # new machine would not have.
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nlmt = "nlmtools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: spawns many git processes; skip with -m 'not slow' during quick iteration",
]
