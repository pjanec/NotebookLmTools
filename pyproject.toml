[project]
name = "nlmtools"
version = "0.1.0"
description = "Load local .txt bundles into NotebookLM via Google Drive, and ask long questions about them"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0",
    "notebooklm-mcp-cli",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nlmt = "nlmtools.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
